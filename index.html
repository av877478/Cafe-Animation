<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Talk Cafe — 3D Pixar-Disney Animated Commercial</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/controls.css">
</head>
<body class="pure-cinema-body">

  <!-- 100% Full-Bleed Cinema Viewport (Zero Frame, Pure Video & Audio) -->
  <div class="cinema-wrapper pure-cinema" id="cinema-container">
    <div class="cinema-viewport-scaler" id="cinema-scaler">
      <!-- 4K High Resolution Canvas Layer -->
      <canvas id="cinema-canvas"></canvas>
    </div>

    <!-- Minimal Tap-to-Play Overlay (Disappears immediately on Click) -->
    <div class="cinema-tap-play-overlay" id="cinema-start-overlay">
      <div class="pure-play-indicator">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      </div>
      <p class="pure-play-hint">Click anywhere to Play Video with Sound</p>
    </div>
  </div>

  <!-- Auto-Hiding Sleek Floating Controller (100% Invisible during playback) -->
  <div class="pure-floating-controls" id="pure-controls">
    <div class="controls-inner-pill">
      <!-- Play / Pause -->
      <button class="pure-icon-btn" id="btn-play" title="Play / Pause (Spacebar)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>

      <!-- Scrubber Track -->
      <div class="pure-timeline-scrubber" id="timeline-scrubber">
        <div class="pure-track-bg">
          <div class="pure-progress-fill" id="timeline-progress"></div>
          <div class="pure-scrubber-handle" id="scrubber-handle"></div>
        </div>
      </div>

      <!-- Time Readout -->
      <span class="pure-time-display" id="time-display">0:00 / 0:55</span>

      <!-- Volume / Audio -->
      <button class="pure-icon-btn" id="btn-mute" title="Toggle Sound">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
      <input type="range" class="pure-vol-slider" id="vol-master" min="0" max="1" step="0.05" value="0.9" title="Volume">

      <!-- Record MP4 Video Button -->
      <button class="pure-btn-record" id="btn-record" title="Record and download 60FPS MP4 video">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        <span>MP4</span>
      </button>

      <!-- Fullscreen Toggle -->
      <button class="pure-icon-btn" id="btn-fullscreen" title="Fullscreen (F)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
      </button>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/voiceover.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
